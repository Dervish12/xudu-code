name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Test
        run: |
          for package in packages/*/; do
            if grep -q '"test"' "$package/package.json"; then
              echo "::group::$package"
              (cd "$package" && bun run test)
              echo "::endgroup::"
            fi
          done
